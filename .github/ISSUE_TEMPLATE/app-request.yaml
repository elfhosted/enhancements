name: "🍰 Request a new app!"
description: I have a request for a new, ElfHosted app
title: "[app] "
labels: ["app/request", "status/backlog"]

body:
  - type: markdown
    attributes:
      value: |
        ## :wave: Greetings

        Greetings, Elfie! 
        
        Thanks for taking the time to request this app! This issue form helps to capture the 
        request in a standardized way, and to pre-gather as much information as possible

  - type: checkboxes
    id: sanity_check
    attributes:
      label: 🤪 Sanity check
      description: Let's confirm that this is not a app which has previously been discussed / proposed
      options:
        - label: I have searched and confirmed no existing [open](https://github.com/elfhosted/enhancements/issues?q=is%3Aissue) / [closed](https://github.com/elfhosted/enhancements/issues?q=is%3Aissue+is%3Aclosed) issues, or [open](https://github.com/elfhosted/enhancements/pulls?q=is%3Apr) / [closed](https://github.com/elfhosted/enhancements/pulls?q=is%3Apr+is%3Aclosed) PRs exist for this app
          required: true       
        - label: I have confirmed that the app is actively supported by its developers (_i.e., not deprecated or abandoned_)
          required: true
          

  - type: textarea
    attributes:
      label: 📜 Description
      description: Please provide a brief description of the proposed app
    validations:
      required: true

  - type: input
    id: project_homepage
    attributes:
      label: 🏠 Project Homepage
      description: Provide a link to the project's homepage
      placeholder: e.g. https://radarr.video/
    validations:
      required: true

  - type: dropdown
    id: license
    attributes:
      label: 📄 License
      description: What license does the project use? ElfHosted can only host apps whose license permits managed/SaaS hosting. Check the LICENSE file in the project's repo.
      options:
        - MIT
        - Apache 2.0
        - BSD (2 or 3-clause)
        - ISC
        - MPL 2.0
        - Unlicense
        - GPL v2
        - GPL v3
        - AGPL v3
        - Other (please specify in description)
        - No license / Unknown
    validations:
      required: true

  - type: checkboxes
    id: license_check
    attributes:
      label: ✅ License compatibility
      description: Confirm the app's license allows managed hosting
      options:
        - label: I have confirmed that the app's license permits commercial/managed hosting (not "personal use only", SSPL, BSL, Elastic License, or similar restrictive licenses)
          required: true

  - type: input
    id: discord_id
    attributes:
      label: 💬 Your Discord username
      description: If you've joined our [Discord server](http://discord.elfhosted.com), enter your username here so that we can collaborate effectively
      placeholder: BobTheBuilder#4567

  - type: markdown
    attributes:
      value: |
        ---
        ### 📋 For ElfHosted staff — shipping checklist

        An app is not shipped when the container builds. Each of the following
        fails **silently** if skipped — the app simply appears undocumented or
        unnamed to the customer, with nothing reporting a problem:

        - [ ] **Docs page** at `docs/app/<slug>.md`, in the `elfhosted/docs.elfhosted.com` repo
        - [ ] **Slug matches everywhere** — the docs filename, the store product slug, and
              the Gandalf app-catalog key must be the SAME string. A page at
              `mediaflow-proxy.md` is invisible to anything looking for `mediaflowproxy`.
        - [ ] **`mkdocs.yml` nav entry** — a page absent from `nav:` does not appear on the site
        - [ ] **`DOCS-SPLIT-MANIFEST.md` row** — page → A/B/C/D disposition → one-line rationale
        - [ ] **`visibility:` frontmatter** for C/D, then `python3 scripts/gen-split-redirects.py`
        - [ ] **App catalog entry** in `elfhosted/tenants` `app-catalog.yaml` — label, blurb,
              `docs:` slug. Without one the app is hidden from `/my-account/apps/` entirely
              (it will show up in Gandalf's `uncatalogued` list)
        - [ ] **Icon** at `icons.elfhosted.com` — add a square PNG to
              `containers-private/apps/homer/png/` and rebuild the `icons` container.
              Missing icons fall back to a letter-mark
